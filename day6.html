<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>proudct mangment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Add a new product</h2>
    
    <input type="text" id="name" placeholder="Product Name">
    <input type="text" id="desc" placeholder="Product Description">
    
    <select id="color">
        <option value="white">white</option>
        <option value="black">black</option>
        <option value="red">red</option>
        <option value="blue">blue</option>
    </select>

    <div class="checkbox-group">
        <label>is the product out of stock ?</label>
        <input type="checkbox" id="stock">
    </div>

    <button id="addBtn" class="btn-add">Add Product</button>
    <button id="updateBtn" class="btn-update">Update Product</button>

    <hr>

    <input type="text" id="search" placeholder="Search by product name ..">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Color</th>
                <th>Status</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>
</div>

<script src="day6.js"></script>
</body>
</html>

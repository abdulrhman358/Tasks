<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XHR CRUD Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
   
    <div class="mb-5">
      <h3>Read Posts</h3>
      <button id="loadBtn" class="btn btn-primary mb-3">Load Posts</button>
      <div id="postsContainer" class="row"></div> 
    </div>


    <div class="mb-5">
      <h3>Create Post</h3>
      <form id="postForm">
        <div class="mb-2">
          <input type="text" class="form-control" id="titleInput" placeholder="Title" required>
        </div>
        <div class="mb-2">
          <textarea class="form-control" id="bodyInput" placeholder="Body" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Add Post</button>
      </form>
      <div id="resultContainer" class="mt-3"></div>
    </div>

    
    <div class="mb-5">
      <h3>Update Post</h3>
      <form id="updateForm">
        <div class="mb-2">
          <input type="number" class="form-control" id="updateIdInput" placeholder="Post ID" required>
        </div>
        <div class="mb-2">
          <input type="text" class="form-control" id="updateTitleInput" placeholder="New Title" required>
        </div>
        <div class="mb-2">
          <textarea class="form-control" id="updateBodyInput" placeholder="New Body" required></textarea>
        </div>
        <button type="submit" class="btn btn-info text-white">Update Post</button>
      </form>
      <div id="updateResultContainer" class="mt-3"></div>
    </div>

    
    <div class="mb-5">
      <h3>Delete Post</h3>
      <form id="deleteForm">
        <div class="mb-2">
          <input type="number" class="form-control" id="deleteIdInput" placeholder="Post ID" required>
        </div>
        <button type="submit" class="btn btn-danger">Delete Post</button>
      </form>
      <div id="deleteResultContainer" class="mt-3"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
